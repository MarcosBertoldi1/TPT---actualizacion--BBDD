<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Tecnología para Todos</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    
    <style>
        .contenedor-formularios {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }
        .caja-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
            width: 100%;
            max-width: 400px;
        }
        .caja-form h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }
        .grupo-input {
            margin-bottom: 15px;
        }
        .grupo-input label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .grupo-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-full {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            font-weight: bold;
        }
        .btn-ingresar { background: #0056b3; color: white; }
        .btn-google-style { background: #db4437; color: white; margin-top: 15px; }
        .btn-registrar { background: #28a745; color: white; }
        .mensaje-error { color: #dc3545; font-weight: bold; margin-top: 10px; text-align: center; font-size: 0.9rem; min-height: 20px;}
        .texto-cambio { text-align: center; margin-top: 20px; font-size: 0.95rem; }
        /* Campo de contraseña con botón "ojo" (funciona en celular y compu) */
        .grupo-input .campo-password { position: relative; }
        .grupo-input .campo-password input { padding-right: 48px; }
        /* Oculta el ojito nativo de Edge para no mostrar dos */
        .grupo-input .campo-password input::-ms-reveal,
        .grupo-input .campo-password input::-ms-clear { display: none; }
        .btn-ver-password {
            position: absolute;
            top: 0;
            right: 0;
            width: 44px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: none;
            background: none;
            color: #555;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            -webkit-tap-highlight-color: transparent; /* sin recuadro celeste al tocar en celular */
        }
        .btn-ver-password:hover { color: #0056b3; }
        .btn-ver-password:focus-visible { outline: 2px solid #0056b3; outline-offset: -2px; }
        .btn-ver-password svg { width: 22px; height: 22px; display: block; }
        .btn-ver-password .ojo-tachado { display: none; }
        .btn-ver-password[aria-pressed="true"] .ojo-normal { display: none; }
        .btn-ver-password[aria-pressed="true"] .ojo-tachado { display: block; }
        .btn-enlace { background: none; border: none; color: #0056b3; font-weight: bold; cursor: pointer; text-decoration: underline; padding: 0; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header class="encabezado-principal">
        <div class="contenedor-header">
            <a href="index.html" class="logo-banner">
                <img src="img/logoTPT4.png" alt="Logo TPT" class="logo-img-banner" width="75" height="75">
                <div class="logo-texto-lineal">
                    <h1>Tecnología para todos</h1>
                    <span class="tagline">Hacer simple lo que parece difícil.</span>
                </div>
            </a>
        </div>
        <nav class="navegacion-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre.html">Sobre el Proyecto</a></li>
            </ul>
        </nav>
    </header>

    <main id="contenido-principal" class="contenedor-pagina">

        <div class="contenedor-formularios">
            
            <!-- CAJA 1: INICIAR SESIÓN -->
            <div id="caja-login" class="caja-form">
                <h2>Iniciar Sesión</h2>
                <form id="form-login">
                    <div class="grupo-input">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="grupo-input">
                        <label for="password">Contraseña</label>
                        <div class="campo-password">
                            <input type="password" id="password" required>
                            <button type="button" class="btn-ver-password" data-target="password" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-normal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-full btn-ingresar">Ingresar</button>
                    <div id="mensaje-error" class="mensaje-error"></div>
                </form>

                <button id="btn-google" class="btn-full btn-google-style">G Iniciar sesión con Google</button>

                <div class="texto-cambio">
                    ¿No tenés cuenta? <button type="button" id="btn-ir-registro" class="btn-enlace">Crear cuenta</button>
                </div>
            </div>

            <!-- CAJA 2: CREAR CUENTA NUEVA -->
            <div id="caja-registro" class="caja-form" style="display: none;">
                <h2>Crear Cuenta Nueva</h2>
                <form id="form-registro">
                    <div class="grupo-input">
                        <label for="email-registro">Correo Electrónico</label>
                        <input type="email" id="email-registro" required>
                    </div>
                    <div class="grupo-input">
                        <label for="password-registro">Contraseña (Mín. 6 caracteres)</label>
                        <div class="campo-password">
                            <input type="password" id="password-registro" required>
                            <button type="button" class="btn-ver-password" data-target="password-registro" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-normal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-full btn-registrar">Registrarme</button>
                    <div id="mensaje-error-registro" class="mensaje-error"></div>
                </form>

                <div class="texto-cambio">
                    ¿Ya tenés cuenta? <button type="button" id="btn-ir-login" class="btn-enlace">Iniciar sesión</button>
                </div>
            </div>

        </div>

    </main>

    <footer class="pie-pagina" style="margin-top: 50px;">
        <p>Proyecto <strong>Tecnología para Todos</strong>. ET29 DE 6.</p>
    </footer>

    <!-- MOSTRAR / OCULTAR CONTRASEÑA -->
    <script>
        document.querySelectorAll('.btn-ver-password').forEach(function (btn) {
            // Evita que el celular cierre el teclado al tocar el ojo
            btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.getAttribute('data-target'));
                var mostrar = input.type === 'password';
                input.type = mostrar ? 'text' : 'password';
                btn.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
                btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        });
    </script>

    <!-- SCRIPT DE AUTENTICACIÓN -->
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const cajaLogin = document.getElementById('caja-login');
        const cajaRegistro = document.getElementById('caja-registro');
        const btnIrRegistro = document.getElementById('btn-ir-registro');
        const btnIrLogin = document.getElementById('btn-ir-login');

        // Alternar vistas
        btnIrRegistro.addEventListener('click', () => {
            cajaLogin.style.display = 'none';
            cajaRegistro.style.display = 'block';
        });

        btnIrLogin.addEventListener('click', () => {
            cajaRegistro.style.display = 'none';
            cajaLogin.style.display = 'block';
        });

        const formLogin = document.getElementById('form-login');
        const btnGoogle = document.getElementById('btn-google');
        const formRegistro = document.getElementById('form-registro');
        
        const mensajeError = document.getElementById('mensaje-error');
        const mensajeErrorRegistro = document.getElementById('mensaje-error-registro');

        async function verificarRolYRedirigir(user) {
            const email = user.email.toLowerCase(); 

            const correosAdmin = [
                'marcos.bertoldi.945@alutecnica29de6.edu.ar', 
                'agustin.meza.779@alutecnica29de6.edu.ar'
            ];

            if (correosAdmin.includes(email)) {
                localStorage.setItem('rolUsuario', 'admin'); 
                alert(`¡Bienvenido/a Administrador/a!`);
            } else if (email.endsWith('@tecnica29de6.edu.ar')) {
                localStorage.setItem('rolUsuario', 'profesor'); 
                alert(`¡Bienvenido/a Profesor/a!`);
            } else {
                localStorage.setItem('rolUsuario', 'alumno'); 
                alert(`¡Bienvenido/a Alumno/a!`);
            }

            // Redirección compatible con GitHub Pages y Localhost
            const esGitHub = window.location.hostname.includes('github.io');
            window.location.href = esGitHub 
                ? '/TPT---actualizacion--BBDD/index.html' 
                : './index.html';
        }

        if (formLogin) {
            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                mensajeError.textContent = '';

                try {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    await verificarRolYRedirigir(userCredential.user);
                } catch (error) {
                    console.error("Error al iniciar sesión:", error.code);
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                        mensajeError.textContent = 'Correo o contraseña incorrectos.';
                    } else if (error.code === 'auth/user-not-found') {
                        mensajeError.textContent = 'No existe un usuario registrado con este correo.';
                    } else {
                        mensajeError.textContent = 'Error al intentar ingresar.';
                    }
                }
            });
        }

        if (btnGoogle) {
            btnGoogle.addEventListener('click', async () => {
                const provider = new GoogleAuthProvider();
                mensajeError.textContent = ''; 

                try {
                    const result = await signInWithPopup(auth, provider);
                    await verificarRolYRedirigir(result.user);
                } catch (error) {
                    console.error("Error con Google:", error.code);
                    if (error.code !== 'auth/popup-closed-by-user') {
                        mensajeError.textContent = 'Error al iniciar sesión con Google.';
                    }
                }
            });
        }

        if (formRegistro) {
            formRegistro.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email-registro').value.trim();
                const password = document.getElementById('password-registro').value.trim();
                mensajeErrorRegistro.textContent = '';

                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await verificarRolYRedirigir(userCredential.user);
                } catch (error) {
                    console.error("Error al crear cuenta:", error.code);
                    if (error.code === 'auth/email-already-in-use') {
                        mensajeErrorRegistro.textContent = 'Este correo ya está registrado. Intentá iniciar sesión.';
                    } else if (error.code === 'auth/weak-password') {
                        mensajeErrorRegistro.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                    } else {
                        mensajeErrorRegistro.textContent = 'Error al crear la cuenta.';
                    }
                }
            });
        }
    </script>
</body>
</html>
