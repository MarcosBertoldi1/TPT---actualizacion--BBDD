<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Tecnología para Todos</title>
    
    <!-- Sesión, tema y tamaño de letra: se aplican antes de mostrar la página para que no parpadee -->
    <script>(function(){try{var d=document.documentElement,u=localStorage.getItem('tptUsuario');if(!u)return;d.setAttribute('data-sesion','activa');var c=u.charAt(0).toUpperCase();d.style.setProperty('--inicial','"'+(/[A-Z0-9]/.test(c)?c:'?')+'"');var t=localStorage.getItem('tema');if(t?t==='oscuro':window.matchMedia('(prefers-color-scheme: dark)').matches){d.setAttribute('data-tema','oscuro')}var n=parseInt(localStorage.getItem('tamanoLetra'),10);if(n>0&&n<4){var px=[16,18,20,22][n]+'px';d.style.fontSize=px;d.style.setProperty('--fuente-base',px)}}catch(e){}})();</script>
    <style>html[data-tema="oscuro"]{background:#000f22;color-scheme:dark}</style>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    
    <style>
        .contenedor-formularios {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }
        .caja-form {
            background: var(--color-gris-claro);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--color-borde);
            width: 100%;
            max-width: 400px;
        }
        .caja-form h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }
        .grupo-input {
            margin-bottom: 15px;
        }
        .grupo-input label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .grupo-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--color-borde);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-full {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            font-weight: bold;
        }
        .btn-ingresar { background: var(--color-primario); color: var(--color-texto-sobre-primario); }
        .btn-google-style { background: #db4437; color: white; margin-top: 15px; }
        .btn-registrar { background: #28a745; color: white; }
        .mensaje-error { color: #dc3545; font-weight: bold; margin-top: 10px; text-align: center; font-size: 0.9rem; min-height: 20px;}
        .texto-cambio { text-align: center; margin-top: 20px; font-size: 0.95rem; }
        /* Campo de contraseña con botón "ojo" (funciona en celular y compu) */
        .grupo-input .campo-password { position: relative; }
        .grupo-input .campo-password input { padding-right: 48px; }
        /* Oculta el ojito nativo de Edge para no mostrar dos */
        .grupo-input .campo-password input::-ms-reveal,
        .grupo-input .campo-password input::-ms-clear { display: none; }
        .btn-ver-password {
            position: absolute;
            top: 0;
            right: 0;
            width: 44px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: none;
            background: none;
            color: var(--color-texto-suave);
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            -webkit-tap-highlight-color: transparent; /* sin recuadro celeste al tocar en celular */
        }
        .btn-ver-password:hover { color: var(--color-primario); }
        .btn-ver-password:focus-visible { outline: 2px solid var(--color-primario); outline-offset: -2px; }
        .btn-ver-password svg { width: 22px; height: 22px; display: block; }
        .btn-ver-password .ojo-tachado { display: none; }
        .btn-ver-password[aria-pressed="true"] .ojo-normal { display: none; }
        .btn-ver-password[aria-pressed="true"] .ojo-tachado { display: block; }
        .btn-enlace { background: none; border: none; color: var(--color-primario); font-weight: bold; cursor: pointer; text-decoration: underline; padding: 0; font-size: 0.95rem; }
        .caja-form label { color: var(--color-texto); }
        .grupo-input input { background: var(--color-fondo); color: var(--color-texto); }
    </style>
</head>
<body>

    <header class="encabezado-principal">
        <div class="contenedor-header">
            <a href="index.html" class="logo-banner">
                <img src="img/logoTPT4.png" alt="Logo TPT" class="logo-img-banner" width="75" height="75">
                <div class="logo-texto-lineal">
                    <h1>Tecnología para todos<span class="h1-sep"> - </span><span class="h1-escuela">ET N° 29 D.E. 6</span></h1>
                </div>
            </a>
            <div class="usuario-menu" id="usuarioMenu">
                <button class="usuario-avatar" id="btnUsuario" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="usuarioPanel" aria-label="Menú de usuario"><span class="inicial" aria-hidden="true"></span></button>
                <div class="usuario-panel" id="usuarioPanel" hidden>
                    <div class="usuario-cabecera">
                        <span class="usuario-avatar usuario-avatar--grande" aria-hidden="true"><span class="inicial"></span></span>
                        <strong class="usuario-email" id="usuarioEmail"></strong>
                    </div>
                    <div class="usuario-fila">
                        <span class="usuario-fila-texto">Tamaño de letra<small class="usuario-fila-detalle" id="letraNivel">normal</small></span>
                        <div class="letra-control">
                            <button class="btn-letra btn-letra--menos" id="btnLetraMenos" type="button" aria-label="Achicar letra">A&minus;</button>
                            <button class="btn-letra btn-letra--mas" id="btnLetraMas" type="button" aria-label="Agrandar letra">A+</button>
                        </div>
                    </div>
                    <div class="usuario-fila">
                        <span class="usuario-fila-texto">Tema oscuro</span>
                        <button class="interruptor-tema" id="btnTema" type="button" role="switch" aria-checked="false" aria-label="Tema oscuro" title="Tema oscuro"><span class="interruptor-perilla"></span><span class="interruptor-icono interruptor-luna" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg></span><span class="interruptor-icono interruptor-sol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span></button>
                    </div>
                    <hr class="usuario-separador">
                    <button class="usuario-salir" id="btnSalir" type="button">
                        <span>Cerrar sesión</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" fill="currentColor"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <nav class="navegacion-principal" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li id="nav-materiales"><a href="materiales.html">Materiales</a></li>
                <li><a href="sobre.html">Sobre el Proyecto</a></li>
                <li id="item-login"><a href="login.html" class="activo" aria-current="page">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main id="contenido-principal" class="contenedor-pagina">

        <div class="contenedor-formularios">
            
            <!-- CAJA 1: INICIAR SESIÓN -->
            <div id="caja-login" class="caja-form">
                <h2>Iniciar Sesión</h2>
                <form id="form-login">
                    <div class="grupo-input">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="grupo-input">
                        <label for="password">Contraseña</label>
                        <div class="campo-password">
                            <input type="password" id="password" required>
                            <button type="button" class="btn-ver-password" data-target="password" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-normal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-full btn-ingresar">Ingresar</button>
                    <div id="mensaje-error" class="mensaje-error"></div>
                </form>

                <button id="btn-google" class="btn-full btn-google-style">G Iniciar sesión con Google</button>

                <div class="texto-cambio">
                    ¿No tenés cuenta? <button type="button" id="btn-ir-registro" class="btn-enlace">Crear cuenta</button>
                </div>
            </div>

            <!-- CAJA 2: CREAR CUENTA NUEVA -->
            <div id="caja-registro" class="caja-form" style="display: none;">
                <h2>Crear Cuenta Nueva</h2>
                <form id="form-registro">
                    <div class="grupo-input">
                        <label for="email-registro">Correo Electrónico</label>
                        <input type="email" id="email-registro" required>
                    </div>
                    <div class="grupo-input">
                        <label for="password-registro">Contraseña (Mín. 6 caracteres)</label>
                        <div class="campo-password">
                            <input type="password" id="password-registro" required>
                            <button type="button" class="btn-ver-password" data-target="password-registro" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="ojo-normal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-full btn-registrar">Registrarme</button>
                    <div id="mensaje-error-registro" class="mensaje-error"></div>
                </form>

                <div class="texto-cambio">
                    ¿Ya tenés cuenta? <button type="button" id="btn-ir-login" class="btn-enlace">Iniciar sesión</button>
                </div>
            </div>

        </div>

    </main>

    <footer class="pie-pagina" style="margin-top: 50px;">
        <p>Proyecto <strong>Tecnología para Todos</strong>. ET29 DE 6.</p>
    </footer>

    <!-- MOSTRAR / OCULTAR CONTRASEÑA -->
    <script>
        document.querySelectorAll('.btn-ver-password').forEach(function (btn) {
            // Evita que el celular cierre el teclado al tocar el ojo
            btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.getAttribute('data-target'));
                var mostrar = input.type === 'password';
                input.type = mostrar ? 'text' : 'password';
                btn.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
                btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });
        });
    </script>

    <!-- ALTERNAR ENTRE INICIAR SESIÓN Y CREAR CUENTA -->
    <script>
        const cajaLogin = document.getElementById('caja-login');
        const cajaRegistro = document.getElementById('caja-registro');

        document.getElementById('btn-ir-registro').addEventListener('click', () => {
            cajaLogin.style.display = 'none';
            cajaRegistro.style.display = 'block';
        });

        document.getElementById('btn-ir-login').addEventListener('click', () => {
            cajaRegistro.style.display = 'none';
            cajaLogin.style.display = 'block';
        });
    </script>

    <!-- AUTENTICACIÓN Y ROLES (toda la lógica está en js/login.js) -->
    <script type="module" src="js/login.js"></script>
    <script src="js/header.js"></script>
    <script type="module" src="js/sesion.js"></script>
</body>
</html>
